
{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập | MatchUp</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="{% static 'css/auth.css' %}">
</head>

<body>
<div class="mu-auth-page">

    <div class="mu-auth-card">

        <a href="/" class="mu-auth-logo">
            <span class="mu-auth-logo-icon">
                <i class="fa-solid fa-trophy"></i>
            </span>
            <span>Match<b>Up</b></span>
        </a>

        <div class="mu-auth-heading">
            <h1>Chào mừng trở lại!</h1>
            <p>Đăng nhập để tiếp tục đặt sân yêu thích</p>
        </div>

        <form action="" method="post">
            {% csrf_token %}

            <div class="mu-auth-field">
                <label for="email">Email</label>
                <div class="mu-auth-input">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="example@gmail.com"
                           autocomplete="email"
                           required>
                </div>
            </div>

            <div class="mu-auth-field">
                <label for="password">Mật khẩu</label>
                <div class="mu-auth-input">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Nhập mật khẩu"
                           autocomplete="current-password"
                           required>
                    <button type="button"
                            class="mu-toggle-password"
                            aria-label="Hiện mật khẩu"
                            onclick="togglePassword('password', this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mu-auth-options">
                <label class="mu-remember">
                    <input type="checkbox" name="remember">
                    Ghi nhớ đăng nhập
                </label>

                <a href="#" class="mu-auth-link">
                    Quên mật khẩu?
                </a>
            </div>

            <button type="submit" class="mu-auth-submit">
                Đăng nhập
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="mu-auth-bottom">
            Chưa có tài khoản?
            <a href="/accounts/register/">Đăng ký ngay</a>
        </div>

        <a href="/" class="mu-auth-back">
            <i class="fa-solid fa-arrow-left"></i>
            Quay về trang chủ
        </a>

    </div>
</div>

<script>
function togglePassword(id, button) {
    const input = document.getElementById(id);
    const icon = button.querySelector("i");

    const isHidden = input.type === "password";
    input.type = isHidden ? "text" : "password";

    icon.className = isHidden
        ? "fa-regular fa-eye-slash"
        : "fa-regular fa-eye";

    button.setAttribute(
        "aria-label",
        isHidden ? "Ẩn mật khẩu" : "Hiện mật khẩu"
    );
}
</script>
</body>
</html>
