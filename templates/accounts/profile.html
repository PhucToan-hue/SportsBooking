
{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3>Thông tin tài khoản</h3>

        <p><strong>Tên đăng nhập:</strong>
            {{ user.username }}
        </p>

        <p><strong>Họ tên:</strong>
            {{ user.full_name }}
        </p>

        <p><strong>Email:</strong>
            {{ user.email }}
        </p>

        <p><strong>Số điện thoại:</strong>
            {{ user.phone }}
        </p>

        <p><strong>Vai trò:</strong>
            {{ user.get_role_display }}
        </p>
    </div>
</div>
{% endblock %}
